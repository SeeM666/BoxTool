name: Build Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libgl1-mesa-dev \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            cmake \
            wget \
            curl
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
      
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade buildozer cython virtualenv pexpect sh
      
      - name: Patch buildozer to use existing NDK
        run: |
          # Find buildozer targets/android.py
          BUILDOZER_PATH=$(python -c "import buildozer, os; print(os.path.join(os.path.dirname(buildozer.__file__), 'targets', 'android.py'))")
          echo "Patching: $BUILDOZER_PATH"
          
          # Add NDK environment check at the beginning of _install_android_ndk method
          python << 'PYEOF'
import re

with open("$BUILDOZER_PATH", 'r') as f:
    content = f.read()

# Find the _install_android_ndk method and add env check
old_pattern = r"(    def _install_android_ndk\(self\):.*?ndk_dir = self\.buildozer\.global_config\.get\('ndk_dir', None\))"
new_code = r"""\1
        # Check ANDROID_NDK environment variable first
        import os
        env_ndk = os.environ.get('ANDROID_NDK')
        if env_ndk and os.path.exists(env_ndk):
            self.buildozer.info(f'Using NDK from ANDROID_NDK env: {env_ndk}')
            return env_ndk
        env_ndk_home = os.environ.get('ANDROID_NDK_HOME')
        if env_ndk_home and os.path.exists(env_ndk_home):
            self.buildozer.info(f'Using NDK from ANDROID_NDK_HOME env: {env_ndk_home}')
            return env_ndk_home"""

content = re.sub(old_pattern, new_code, content, flags=re.DOTALL)

with open("$BUILDOZER_PATH", 'w') as f:
    f.write(content)

print('Patched successfully')
PYEOF
      
      - name: Prepare buildozer.spec
        run: |
          sed -i 's/^android.ndk.*/android.ndk = 25.2.9519653/' buildozer.spec
          sed -i 's/^android.api.*/android.api = 33/' buildozer.spec
          sed -i 's/^android.minapi.*/android.minapi = 21/' buildozer.spec
          cat buildozer.spec
      
      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK: ${{ env.ANDROID_NDK }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/tools:$ANDROID_SDK_ROOT/platform-tools
          rm -rf .buildozer bin
          buildozer -v android debug 2>&1 | tee build.log
      
      - name: Find and upload APK
        if: success()
        id: find_apk
        run: |
          ls -la bin/ || echo "bin/ not found"
          APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "✓ APK: $APK_PATH"
          else
            echo "✗ No APK!"
            exit 1
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: steps.find_apk.outputs.apk_path
        with:
          name: BoxTool-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
      
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && steps.find_apk.outputs.apk_path
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
