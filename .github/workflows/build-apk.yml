name: Build Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libgl1-mesa-dev \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            cmake \
            wget \
            curl
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Set up Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
      
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade cython virtualenv
          pip install git+https://github.com/kivy/python-for-android.git
      
      - name: Prepare buildozer.spec
        run: |
          sed -i 's/^android.ndk.*/android.ndk = 25.2.9519653/' buildozer.spec
          sed -i 's/^android.api.*/android.api = 33/' buildozer.spec
          sed -i 's/^android.minapi.*/android.minapi = 21/' buildozer.spec
          cat buildozer.spec
      
      - name: Build APK with p4a
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK: ${{ env.ANDROID_NDK }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/tools:$ANDROID_SDK_ROOT/platform-tools
          
          # Create dist directory
          mkdir -p dist
          
          # Build with python-for-android directly
          p4a apk \
            --private . \
            --package=org.boxtool \
            --name="BoxTool" \
            --version=5.0.0 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy==2.3.0,requests,beautifulsoup4,pymysql,qrcode,Pillow,dnspython \
            --minsdk=21 \
            --target-api=33 \
            --ndk-version=25.2.9519653 \
            --arch=arm64-v8a \
            --arch=armeabi-v7a \
            --permission=INTERNET \
            --permission=ACCESS_NETWORK_STATE \
            --permission=WRITE_EXTERNAL_STORAGE \
            --permission=READ_EXTERNAL_STORAGE \
            --add-source=. \
            --dist-name=boxtool-dist \
            2>&1 | tee build.log
      
      - name: Find and upload APK
        if: success()
        id: find_apk
        run: |
          echo "=== Searching for APK ==="
          find ~/.local/share/python-for-android -name "*.apk" -type f 2>/dev/null || echo "No APK in default location"
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK in current directory"
          
          APK_PATH=$(find ~/.local/share/python-for-android -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -n 1)
          fi
          
          if [ -n "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "✓ Found APK: $APK_PATH"
            ls -la "$APK_PATH"
          else
            echo "✗ No APK generated!"
            exit 1
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: steps.find_apk.outputs.apk_path
        with:
          name: BoxTool-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
      
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && steps.find_apk.outputs.apk_path
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
