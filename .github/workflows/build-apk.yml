name: Build Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libgl1-mesa-dev \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            cmake \
            wget \
            curl
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Accept licenses & install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
      
      - name: Install NDK
        run: |
          sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
      
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade buildozer cython virtualenv pexpect sh
      
      - name: Fix buildozer tempfile bug
        run: |
          # Monkey-patch buildozer to fix the tempfile bug
          BUILDOZER_INIT=$(python -c "import buildozer; print(buildozer.__file__)")
          echo "Buildozer path: $BUILDOZER_INIT"
          
          # Create a wrapper to handle the tempfile issue
          cat > /tmp/buildozer_fix.py << 'PATCH'
          import urllib.request
          import tempfile
          import os
          
          original_urlretrieve = urllib.request.urlretrieve
          
          def patched_urlretrieve(url, filename=None, reporthook=None, data=None):
              if filename:
                  dirname = os.path.dirname(filename)
                  if dirname:
                      os.makedirs(dirname, exist_ok=True)
                  return original_urlretrieve(url, filename, reporthook, data)
              else:
                  return original_urlretrieve(url, filename, reporthook, data)
          
          urllib.request.urlretrieve = patched_urlretrieve
          PATCH
      
      - name: Debug environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "NDK_HOME=$NDK_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          which python
          python --version
          which java
          java --version
      
      - name: Prepare buildozer.spec
        run: |
          cat buildozer.spec
          # Ensure NDK is correct
          sed -i 's/^android.ndk.*/android.ndk = 25.2.9519653/' buildozer.spec
          sed -i 's/^android.api.*/android.api = 33/' buildozer.spec
          sed -i 's/^android.minapi.*/android.minapi = 21/' buildozer.spec
          sed -i 's/^android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec
          echo "=== Final buildozer.spec ==="
          cat buildozer.spec
      
      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/tools:$ANDROID_SDK_ROOT/platform-tools
          
          # Clean everything
          rm -rf .buildozer bin
          
          # Build
          buildozer -v android debug 2>&1 | tee build.log
      
      - name: Find and upload APK
        if: success()
        run: |
          echo "=== Build output ==="
          ls -la bin/ || echo "bin/ not found"
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          
          APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "✓ APK: $APK_PATH"
            ls -la "$APK_PATH"
          else
            echo "✗ No APK generated!"
            exit 1
          fi
        id: find_apk
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: steps.find_apk.outputs.apk_path
        with:
          name: BoxTool-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
      
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && steps.find_apk.outputs.apk_path
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
